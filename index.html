<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berufsschule Lernkram</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1c2333;--mut:#667085;--line:#dfe4ee;--pri:#3b5bdb;--ok:#1f9d55;--bar:#e7ebf5}
@media (prefers-color-scheme:dark){:root{--bg:#10141f;--card:#1a2030;--tx:#e8ecf6;--mut:#97a1b8;--line:#2b3348;--pri:#6f8cff;--ok:#43c47a;--bar:#262e44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px}
h1{margin:.1em 0;font-size:1.8rem}
.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
a.card,div.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--pri);box-shadow:0 4px 16px rgba(59,91,219,.15)}
.ic{font-size:1.8rem}
.card h2{margin:.3em 0 .1em;font-size:1.1rem}
.card p{margin:.2em 0 .8em;color:var(--mut);font-size:.92rem}
.tag{display:inline-block;font-size:.75rem;padding:1px 9px;border-radius:99px;background:var(--bar);color:var(--mut)}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden;margin:6px 0 2px}.bar>i{display:block;height:100%;background:var(--ok)}
.small{font-size:.82rem;color:var(--mut)}
.soon{border-style:dashed;opacity:.75}
footer{margin-top:28px;color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>📚 Berufsschule Lernkram</h1>
  <p class="sub">Wähle ein Fach zum Üben. Dein Fortschritt wird pro Fach in diesem Browser gespeichert.</p>
  <div class="grid" id="grid"></div>
  <footer>Auf ein anderes Gerät wechseln? Öffne das Fach und nutze dort unten „Fortschritt sichern / laden“.</footer>
</main>
<script>
/* Neues Fach hinzufügen: einfach einen Eintrag ergänzen.
   path  = Ordner des Fachs (mit index.html)
   meta  = localStorage-Schlüssel, in den das Fach {pct,xp,t} schreibt (optional) */
const FAECHER=[
  {icon:'🤖',title:'LF 7 – Cyber-physische Systeme',desc:'IoT, IIoT, Industrie 4.0, MQTT, Funktechnik, Serverraum-Gefahren, Schnittstellen. Kann-Liste Woche 1 + 2.',path:'cyberphysische-systeme/',meta:'meta:lf7',tag:'Lernfeld 7'}
  /* ,{icon:'🌐',title:'LF 8 – …',desc:'…',path:'lf8/',meta:'meta:lf8',tag:'Lernfeld 8'} */
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function meta(key){try{return key?JSON.parse(localStorage.getItem(key)):null}catch(e){return null}}
const g=document.getElementById('grid');
g.innerHTML=FAECHER.map(f=>{
  const m=meta(f.meta);
  const pr=m?`<div class="bar"><i style="width:${m.pct}%"></i></div><div class="small">${m.pct}% gemeistert · ⭐ ${m.xp} XP${m.t?' · zuletzt '+new Date(m.t).toLocaleDateString('de-DE'):''}</div>`:'<div class="small">Noch nicht gestartet</div>';
  return `<a class="card" href="${esc(f.path)}"><div class="ic">${f.icon}</div><span class="tag">${esc(f.tag||'')}</span><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p>${pr}</a>`;
}).join('')+`<div class="card soon"><div class="ic">➕</div><h2>Weitere Fächer folgen</h2><p>Hier erscheinen später die nächsten Lernfelder und Fächer.</p></div>`;
</script>
</body>
</html>
