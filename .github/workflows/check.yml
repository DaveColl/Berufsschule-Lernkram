name: Aufgaben prüfen
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lernspiel-Aufgaben auf Fehler prüfen
        run: node tools/check.js cyberphysische-systeme
